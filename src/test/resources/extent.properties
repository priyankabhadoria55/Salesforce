#extent.reporter.spark.start=true
#extent.reporter.spark.out=Reports/Spark.html
#extent.reporter.spark.base64imagesrc=true
#extent.reporter.spark.config=Extent-config.xml

# Enable Spark Reporter (Modern HTML Report)
extent.reporter.spark.start=true
extent.reporter.spark.out=test-output/HtmlReport/ExtentHtml.html
extent.reporter.spark.base64imagesrc=true
extent.reporter.spark.config=Extent-config.xml

# Enable Screenshots for passed/failed tests
extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log

# System Information
systeminfo.os=Windows
systeminfo.user=Automation Team
systeminfo.build=UNITE Framework
systeminfo.project=XfilesPro

# Screenshots
screenshot.dir=test-output/screenshots/
screenshot.rel.path=../screenshots/

# Report Configuration
#extent.reporter.spark.base64imagesrc=true

# PDF Reporter (Optional - generates PDF report)
extent.reporter.pdf.start=true
extent.reporter.pdf.out=test-output/HtmlReport/ExtentPDF.pdf

# JSON Reporter (Optional - for CI/CD integration)
extent.reporter.json.start=false
extent.reporter.json.out=test-output/HtmlReport/ExtentJson.json
